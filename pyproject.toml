[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurips-trend"
version = "1.0.0"
description = "Review-guided topic modeling and trend analysis for NeurIPS OpenReview data"
requires-python = ">=3.10"
readme = "README.md"
authors = [
  {name = "COMP4040 Team"}
]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "joblib>=1.3",
  "pyarrow>=14.0",
  "sentence-transformers>=2.6",
  "transformers>=4.40",
  "torch>=2.1",
  "bertopic>=0.16",
  "umap-learn>=0.5",
  "hdbscan>=0.8",
  "gensim>=4.3",
  "spacy>=3.7"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
