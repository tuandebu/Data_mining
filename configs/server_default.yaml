project:
  name: neurips_review_guided_trend_mining
  years: [2023, 2024, 2025]
  random_seed: 42

paths:
  # These are overridden by shell scripts.
  raw_input: null
  output_dir: artifacts_full

text:
  source_column: text_clean
  min_chars: 50
  use_spacy: false
  spacy_model: en_core_web_sm
  custom_stopwords:
    - paper
    - method
    - methods
    - model
    - models
    - approach
    - approaches
    - task
    - tasks
    - dataset
    - datasets
    - result
    - results
    - show
    - propose
    - learn
    - learning
    - neural
    - network
    - networks

embedding:
  device: auto        # auto | cuda | cpu
  batch_size: 64
  max_length: 512
  fp16: true
  normalize_embeddings: true
  models:
    minilm:
      enabled: true
      backend: sentence_transformer
      name: sentence-transformers/all-MiniLM-L6-v2
    specter2:
      enabled: true
      backend: hf_auto
      name: allenai/specter2_base

bertopic:
  calculate_probabilities: false
  low_memory: true
  vectorizer:
    min_df: 5
    max_df: 0.80
    ngram_range: [1, 2]
  class_tfidf:
    reduce_frequent_words: true
  grid:
    seeds: [13, 42, 101]
    umap_n_neighbors: [15, 30, 50]
    umap_n_components: [5, 10]
    hdbscan_min_cluster_size: [30, 60, 100]
    hdbscan_min_samples: [5, 10]
  selection:
    min_topics: 12
    max_topics: 80
    max_outlier_rate: 0.35
    # Weighted score: higher is better.
    score_weights:
      coherence_npmi: 1.00
      topic_diversity: 0.60
      outlier_rate: -1.20
      largest_topic_share: -0.60
  outlier_reduction:
    strategy: embeddings

lda:
  enabled: true
  n_topics: 30
  max_features: 20000
  max_iter: 30
  learning_method: batch
  random_state: 42

trend:
  accepted_only: true
  exclude_topics: [-1]
  # Topic 0 was generic in the first milestone. Keep false for rerun models unless topic 0 is still generic.
  exclude_topic_zero: false
  min_topic_size: 20
  min_years_present: 2
  main_rating_column: avg_rating_z_year
  raw_rating_column: avg_rating
  topic_label_top_words: 3

regression:
  dependent: delta_share_pp
  predictors:
    - avg_rating_z_year
    - log_topic_size
    - initial_share_2023_pp
    - prestige_concentration
  robust_cov: HC3
  bootstrap_iters: 2000
  bootstrap_seed: 123

representatives:
  top_k_per_topic: 5
  prefer_high_probability: true
  use_rating_tiebreak: true
  main_topic_count: 12

figures:
  dpi: 220
  max_labels: 14
